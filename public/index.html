<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RSS Childcare 101</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Albert+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<script>try{var t=localStorage.getItem("rss-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="/style.css?v=2">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#F4F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11181C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Childcare 101">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<header class="top">
  <div class="brand"><img src="/rss-logo.png" alt="Resourceful Staffing Support" class="logo" width="64" height="63"><div><small>Resourceful Staffing Support · Induction</small><h1>Childcare 101</h1></div></div>
  <nav class="tabs" aria-label="Views" id="tabs" hidden>
    <button class="tab" id="tab-learn" aria-pressed="true">Training</button>
    <button class="tab" id="tab-cert" aria-pressed="false">My certificate</button>
    <button class="tab" id="tab-track" aria-pressed="false">Tracker</button>
  </nav>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" title="Switch light / dark"></button>
</header>
<div id="app"><p class="loading">Loading…</p></div>
<footer class="foot" id="foot"></footer>
<div class="toast" id="toast" hidden></div>
<script src="/app.js?v=2"></script>
<script>
(function(){
  var b=document.getElementById("themeToggle"), root=document.documentElement;
  var mq=window.matchMedia("(prefers-color-scheme: dark)");
  function current(){ return root.getAttribute("data-theme") || (mq.matches ? "dark" : "light"); }
  function paint(){ var d=current()==="dark"; b.textContent=d?"☀":"☾"; b.setAttribute("aria-label", d?"Switch to light mode":"Switch to dark mode"); }
  b.onclick=function(){ var next=current()==="dark"?"light":"dark"; root.setAttribute("data-theme",next); try{localStorage.setItem("rss-theme",next)}catch(e){} paint(); };
  mq.addEventListener && mq.addEventListener("change", paint); paint();
})();
</script>
<script src="/install.js" defer></script>
</body>
</html>
